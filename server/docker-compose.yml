version: "3.9"

services:
  db:
    image: postgres:16
    container_name: sentinel-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./server
    container_name: sentinel-backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/sentinel?sslmode=disable
      JWT_SECRET: supersecretkey
      PORT: 8080
      ENV: development
      DB_CONNECT_TIMEOUT_SEC: 5
      REDIS_URL: disabled
      AI_TRIAGE_URL: ""
      AI_TRIAGE_API_KEY: ""
      BOOTSTRAP_ADMIN_SECRET: local-bootstrap-secret
    ports:
      - "8080:8080"

volumes:
  postgres_data: